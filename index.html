<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golf with Stream</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- ThreeJS Canvas will be appended here -->
    </div>

    <!-- UI Overlay for Streamer Setup -->
    <div id="setup-ui" class="overlay-panel glass-panel">
        <h1>⛳ Golf with Stream</h1>
        
        <div class="setup-columns">
            <div class="setup-column">
                <div class="setup-section">
                    <label for="channel-name">Twitch Channel</label>
                    <input type="text" id="channel-name" placeholder="e.g. pretorax" value="pretorax" />
                </div>

        <div class="setup-section">
            <h3>Game Rules</h3>
            <div class="input-row">
                <label for="holes-limit">Holes per Session:</label>
                <input type="number" id="holes-limit" value="3" min="1" max="18" class="short-input">
            </div>
            <div class="input-row">
                <label for="shot-limit">Shot Limit (Par + X):</label>
                <input type="number" id="shot-limit" value="10" min="1" class="short-input">
            </div>
            <div class="input-row">
                <label for="lobby-timer">Lobby Timer (s):</label>
                <input type="number" id="lobby-timer" value="20" min="5" class="short-input">
            </div>
            <div class="input-row">
                <label for="round-timer">Round Timer (s):</label>
                <input type="number" id="round-timer" value="180" min="10" class="short-input">
            </div>
        </div>
            </div>

            <div class="setup-column">
                <div class="setup-section">
                    <h3>Level Generator</h3>
            <div class="row">
                <label><input type="radio" name="level-mode" value="procedural" checked> Procedural Mode</label>
                <label><input type="radio" name="level-mode" value="custom"> Custom Level Code</label>
            </div>
            
            <div id="procedural-settings">
                <div class="slider-row">
                    <label>Scale Base: <span id="val-scale">5</span></label>
                    <input type="range" id="freq-scale" min="1" max="10" value="5" oninput="document.getElementById('val-scale').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Water Freq: <span id="val-water">4</span></label>
                    <input type="range" id="freq-water" min="0" max="10" value="4" oninput="document.getElementById('val-water').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Sand Freq: <span id="val-sand">5</span></label>
                    <input type="range" id="freq-sand" min="0" max="10" value="5" oninput="document.getElementById('val-sand').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Hills Freq: <span id="val-hills">5</span></label>
                    <input type="range" id="freq-hills" min="0" max="10" value="5" oninput="document.getElementById('val-hills').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Objects Freq: <span id="val-objects">6</span></label>
                    <input type="range" id="freq-objects" min="0" max="10" value="6" oninput="document.getElementById('val-objects').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Booster Freq: <span id="val-boosters">5</span></label>
                    <input type="range" id="freq-boosters" min="0" max="10" value="5" oninput="document.getElementById('val-boosters').innerText = this.value">
                </div>
                <div class="slider-row">
                    <label>Path Interruption: <span id="val-chaos">5</span></label>
                    <input type="range" id="freq-chaos" min="1" max="10" value="5" oninput="document.getElementById('val-chaos').innerText = this.value">
                </div>
            </div>

            <div id="custom-level-settings" style="display: none;">
                <textarea id="custom-level-code" rows="3" placeholder="Paste Base64/JSON level code from Editor..."></textarea>
                <a href="editor.html" target="_blank" class="small-link">Open Level Editor ↗</a>
                </div>
            </div>
        </div>
        </div>

        <button id="start-game-btn" class="primary-btn">Start Game</button>
    </div>

    <!-- In-Game HUD -->
    <div id="hud-ui" style="display: none;">
        <!-- Clean Solid Top Bar -->
        <div id="hud-top-bar">
            <!-- Left Info & Controls -->
            <div class="top-bar-left">
                <div class="info-block" style="color: white; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 18px; margin-bottom: 10px;">
                    Hole: <span id="hud-hole">1</span> / <span id="hud-holes-total">3</span> &nbsp;|&nbsp; Par: <span id="hud-par">3</span> &nbsp;|&nbsp; Players: <span id="hud-players">0</span>
                </div>
                <div id="hud-streamer-controls">
                    <button id="btn-end-round" class="glass-btn red-btn">Skip</button>
                    <button id="btn-quit-setup" class="glass-btn gray-btn">Quit</button>
                    <label style="pointer-events: auto; font-size: 14px; margin-top: 5px; margin-left: 10px; display: inline-flex; align-items: center; gap: 5px; text-shadow: 1px 1px 2px black; color: white;">
                        <input type="checkbox" id="auto-cam-toggle" checked> Auto-Cam
                    </label>
                </div>
            </div>

            <!-- Center Clock -->
            <div id="hud-timer-overlay">
                <h1 id="hud-timer-text">00:00</h1>
                <p id="hud-timer-label">LOBBY (!play)</p>
            </div>

            <!-- Right Compass -->
            <div class="top-bar-right">
                <div id="hud-compass" class="glass-panel">
                    <div class="compass-ring">
                        <span class="deg-0">0</span>
                        <span class="deg-45">45</span>
                        <span class="deg-90">90</span>
                        <span class="deg-135">135</span>
                        <span class="deg-180">180</span>
                        <span class="deg-225">225</span>
                        <span class="deg-270">270</span>
                        <span class="deg-315">315</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hanging Scorecard -->
        <div id="hud-scorecard" class="glass-panel" style="display: none;">
            <h3>Top 5</h3>
            <ul id="scorecard-list">
                <!-- dynamic -->
            </ul>
        </div>
        
        <!-- Live Notifications Log -->
        <div id="hud-notifications">
            <ul id="notification-list">
                <!-- dynamic -->
            </ul>
        </div>
    </div>

    <!-- Match Complete Overlay -->
    <div id="match-complete-ui" class="overlay-panel glass-panel" style="display: none; text-align: center;">
        <h1>🏆 Match Complete!</h1>
        <h3>Final Scorecard</h3>
        <div class="final-scorecard-container">
            <ul id="final-scorecard-list">
                <!-- dynamic -->
            </ul>
        </div>
        <button id="btn-final-quit" class="primary-btn" style="margin-top: 2rem;">Quit to Setup</button>
    </div>

    <!-- Importmap for CDN Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
    <script type="module" src="src/main.js"></script>
    
    <script>
        // Simple UI logic for toggling custom/procedural
        document.querySelectorAll('input[name="level-mode"]').forEach((elem) => {
            elem.addEventListener("change", function(event) {
                var item = event.target.value;
                document.getElementById('procedural-settings').style.display = item === 'procedural' ? 'block' : 'none';
                document.getElementById('custom-level-settings').style.display = item === 'custom' ? 'block' : 'none';
            });
        });
        // Initial setup strictly mapping to the checked 'procedural' default
        document.getElementById('procedural-settings').style.display = 'block';
        document.getElementById('custom-level-settings').style.display = 'none';
    </script>
</body>
</html>
