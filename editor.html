<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level Editor - Twitch Golf 64</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        body { background-color: #1e293b; overflow: auto; padding: 2rem; color: white; display:flex; flex-direction: column; align-items: center;}
        #editor-grid {
            display: grid;
            gap: 1px;
            background-color: #334155;
            border: 2px solid #000;
            margin-top: 1rem;
        }
        .cell {
            width: 30px;
            height: 30px;
            background-color: #0f172a;
            cursor: crosshair;
            box-sizing: border-box;
        }
        .cell.type-0 { background-color: #0f172a; border: 1px solid #1e293b; } // Empty
        .cell.type-1 { background-color: #4ade80; } // Grass
        .cell.type-2 { background-color: #fef08a; } // Sand
        .cell.type-3 { background-color: #3b82f6; } // Water
        .cell.type-4 { background-color: #94a3b8; } // Wall
        .cell.type-5 { background-color: #ffffff; display:flex; align-items:center; justify-content:center; color: black; font-weight: bold;} // Start (S)
        .cell.type-6 { background-color: #000000; border-radius: 50%; border: 2px solid #4ade80; } // Hole (H)

        .palette { display: flex; gap: 10px; margin-bottom: 20px;}
        .palette button {
            padding: 10px 20px; border: none; cursor: pointer; color: black; font-weight: bold; border-radius: 5px;
        }
        .sel-0 { background-color: #0f172a; color: white !important;}
        .sel-1 { background-color: #4ade80; }
        .sel-2 { background-color: #fef08a; }
        .sel-3 { background-color: #3b82f6; color: white !important;}
        .sel-4 { background-color: #94a3b8; }
        .sel-5 { background-color: #ffffff; border: 2px solid #000; }
        .sel-6 { background-color: #000000; color: white !important; border: 2px solid #4ade80;}
        
        .active-tool { border: 3px solid #fbbf24 !important; transform: scale(1.1); }
        
        #output-container { margin-top: 2rem; width: 100%; max-width: 600px;}
        #output-area { width: 100%; height: 100px; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🛠️ Level Editor</h1>
    
    <div class="row" style="margin-bottom:20px;">
        <label>Width:</label> <input type="number" id="grid-w" value="15" style="width: 60px;">
        <label>Height:</label> <input type="number" id="grid-h" value="20" style="width: 60px;">
        <button id="resize-btn" class="primary-btn" style="width:auto; margin:0;">Reset & Resize</button>
    </div>

    <div class="palette" id="palette">
        <button class="sel-0" data-type="0">Erase(0)</button>
        <button class="sel-1 active-tool" data-type="1">Grass(1)</button>
        <button class="sel-2" data-type="2">Sand(2)</button>
        <button class="sel-3" data-type="3">Water(3)</button>
        <button class="sel-4" data-type="4">Wall(4)</button>
        <button class="sel-5" data-type="5">Start(5)</button>
        <button class="sel-6" data-type="6">Hole(6)</button>
    </div>

    <div id="editor-grid"></div>

    <div id="output-container">
        <button id="export-btn" class="primary-btn">Export to Code</button>
        <p style="margin-top:10px;"><small>Copy this code and paste it into the Game Setup screen.</small></p>
        <textarea id="output-area" readonly></textarea>
    </div>

    <script src="src/editor.js"></script>
</body>
</html>
